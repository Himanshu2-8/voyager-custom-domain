<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Voyager Login</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f2f4f7;
        font-family: Arial, sans-serif;
      }

      .card {
        width: min(360px, calc(100% - 32px));
        padding: 32px;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        color: #222222;
        font-size: 24px;
      }

      p {
        color: #666666;
        font-size: 14px;
        line-height: 1.5;
      }

      button {
        width: 100%;
        margin-top: 20px;
        padding: 12px 16px;
        border: 0;
        border-radius: 6px;
        background: #4285f4;
        color: #ffffff;
        cursor: pointer;
        font-size: 15px;
      }

      button:hover {
        background: #3367d6;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      #message {
        min-height: 22px;
        margin-top: 16px;
        color: #c62828;
        font-size: 13px;
      }

      #logout {
        margin-top: 10px;
        background: #666666;
      }

      #logout:hover {
        background: #444444;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <h1>Sign in to Voyager</h1>

      <p>
        Continue with Google in your browser. After authentication, you will
        return to the Voyager desktop application.
      </p>

      <button id="google-login" type="button">
        Continue with Google
      </button>

      <button id="github-login" type="button" style="margin-top: 10px; background: #24292e;">
        Continue with GitHub
      </button>

      <div id="message" role="status" aria-live="polite"></div>
      <button id="logout" type="button" hidden>
        Log out
      </button>
    </main>

    <script type="module" src="./login.js"></script>
  </body>
</html>
